<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kullanıcı Yönetim Paneli</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --color-myp: #E0371D;
      --color-pyp: #E8B409;
      --color-dp: #09BFE8;
      --color-staff: #7C09E8;
      --color-teacher: #34C28F;
      --color-active: #28a745;
      --color-inactive: #dc3545;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
      padding: 20px;
      width: 100%;
    }

    /* Sayfanın enini en büyük yapma (Full Width) */
    .container {
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }

    h1 {
      margin-bottom: 20px;
      font-size: 24px;
      color: #1a1a1a;
    }

    /* Tablo Konfigürasyonu */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      min-width: 1000px; /* Sütunların sıkışmasını önlemek için */
    }

    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #e0e0e0;
      white-space: nowrap;
    }

    th {
      background-color: #f8f9fa;
      font-weight: 600;
      color: #495057;
    }

    tr:hover {
      background-color: #f1f3f5;
    }

    /* Buton ve Rozet (Badge) Stilleri */
    .btn-badge {
      display: inline-block;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      color: #ffffff !important; /* Buton içi yazılar BEYAZ */
      border-radius: 4px;
      border: none;
      text-align: center;
      line-height: 1;
    }

    /* Departman ve Rol Stilleri */
    .badge-myp { background-color: var(--color-myp); }
    .badge-pyp { background-color: var(--color-pyp); }
    .badge-dp { background-color: var(--color-dp); }
    .badge-staff { background-color: var(--color-staff); }
    .badge-teacher { background-color: var(--color-teacher); }

    /* Status ve Availability Buton Stilleri */
    .btn-active { background-color: var(--color-active); }
    .btn-inactive { background-color: var(--color-inactive); }

    /* Varsayılan Gizlilik Sınıfı */
    .hide-licenses {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Kullanıcı Listesi</h1>
    
    <div class="table-wrapper">
      <table id="usersTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Ad</th>
            <th>Soyad</th>
            <th>E-posta</th>
            <th>Rol</th>
            <th>Departman</th>
            <th class="col-licenses">Lisanslar (Licenses)</th>
            <th>Durum (Status)</th>
            <th>Kullanılabilirlik (Availability)</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <!-- Veriler JavaScript ile buraya eklenecek -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // 1. Supabase Bağlantı Bilgilerini Buraya Girin
    const SUPABASE_URL = "https://gnotendqbgfmlscjnwpz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdub3RlbmRxYmdmbWxzY2pud3B6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDY0NDgsImV4cCI6MjEwMzkyMjQ0OH0.KskgJTM4_Gttl8C5sGFoqDHXbjyxOh5aD2vz34BrZ_s";

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Giriş yapan kullanıcının rolü (Örn: 'teacher', 'admin', 'staff')
    // Bu bilgiyi oturum açan kullanıcı verisinden çekebilirsiniz
    const currentUserRole = "teacher"; 

    document.addEventListener("DOMContentLoaded", () => {
      checkRolePermissions();
      fetchUsers();
    });

    // Rol bazlı gösterim yetkileri
    function checkRolePermissions() {
      if (currentUserRole === 'teacher') {
        // Teacher rolündeyse Licenses sütununu hem başlıktan hem içerikten gizle
        const licenseElements = document.querySelectorAll('.col-licenses');
        licenseElements.forEach(el => el.classList.add('hide-licenses'));
      }
    }

    // Supabase'den Verileri Çekme
    async function fetchUsers() {
      const { data: users, error } = await supabase
        .from('users')
        .select('*');

      if (error) {
        console.error("Veri çekme hatası:", error);
        return;
      }

      renderTable(users);
    }

    // Tabloyu Oluşturma
    function renderTable(users) {
      const tbody = document.getElementById('usersTableBody');
      tbody.innerHTML = '';

      users.forEach(user => {
        const tr = document.createElement('tr');

        // Rol ve Departman Rozet Sınıflandırması
        const roleClass = getRoleClass(user.role);
        const deptClass = getDeptClass(user.department);

        // Status ve Availability için Renk/Buton Mantığı
        const statusClass = (user.status === 'Active' || user.status === 'active' || user.status === true) ? 'btn-active' : 'btn-inactive';
        const statusText = (user.status === 'Active' || user.status === 'active' || user.status === true) ? 'Active' : 'Inactive';

        const availClass = (user.availability === 'Available' || user.availability === 'active' || user.availability === true) ? 'btn-active' : 'btn-inactive';
        const availText = (user.availability === 'Available' || user.availability === 'active' || user.availability === true) ? 'Active' : 'Inactive';

        tr.innerHTML = `
          <td>${user.id || '-'}</td>
          <td>${user.first_name || '-'}</td>
          <td>${user.last_name || '-'}</td>
          <td>${user.email || '-'}</td>
          <td><span class="btn-badge ${roleClass}">${user.role || '-'}</span></td>
          <td><span class="btn-badge ${deptClass}">${user.department || '-'}</span></td>
          <td class="col-licenses ${currentUserRole === 'teacher' ? 'hide-licenses' : ''}">${user.licenses || '-'}</td>
          <td><span class="btn-badge ${statusClass}">${statusText}</span></td>
          <td><span class="btn-badge ${availClass}">${availText}</span></td>
        `;

        tbody.appendChild(tr);
      });
    }

    // Departman Renk Sınıfı Eşleştirici
    function getDeptClass(dept) {
      if (!dept) return '';
      const d = dept.toUpperCase();
      if (d.includes('MYP')) return 'badge-myp';
      if (d.includes('PYP')) return 'badge-pyp';
      if (d.includes('DP')) return 'badge-dp';
      return '';
    }

    // Rol Renk Sınıfı Eşleştirici
    function getRoleClass(role) {
      if (!role) return '';
      const r = role.toLowerCase();
      if (r === 'staff') return 'badge-staff';
      if (r === 'teacher') return 'badge-teacher';
      return '';
    }
  </script>
</body>
</html>
